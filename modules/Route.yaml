name: "Route"
description: "查询代理入口和落地 IP 的运营商与位置。"
author: "BABYANYU"
compat_arguments:
  POLICY: "Proxy"
  ENTRANCE_IP: ""
compat_arguments_desc: "POLICY：查询落地使用的策略组，默认 Proxy。ENTRANCE_IP：可选手填代理入口公网 IP；不能自动读取所选节点，留空仅查询落地。不要填写密码、端口或完整节点链接。"
scriptings:
  - generic:
      name: "egern-route"
      script_url: "https://raw.githubusercontent.com/BABYANYU/Egern/main/scripts/Route.js?v=20261015-1"
      update_interval: 60
      timeout: 15
widgets:
  - name: "Route"
    script_name: "egern-route"
    env:
      POLICY: "{{{POLICY}}}"
      ENTRANCE_IP: "{{{ENTRANCE_IP}}}"
