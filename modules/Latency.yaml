name: "Latency"
description: "5轮 HTTP HEAD 请求耗时中位数与 MAD；固定测速地址 http://1.0.0.1/favicon.ico"
author: "BABYANYU"
compat_arguments:
  NODES: ""
compat_arguments_desc: "NODES：待测节点名称，使用 § 分隔，须与本机节点名称一致。留空仅检测 Proxy 路径。名单需自行同步，不会自动枚举策略组。"
scriptings:
  - generic:
      name: "yanyu-latency"
      script_url: "https://raw.githubusercontent.com/BABYANYU/Egern/main/scripts/Latency.js"
      timeout: 60
widgets:
  - name: "Latency"
    script_name: "yanyu-latency"
    env:
      NODES: "{{{NODES}}}"
