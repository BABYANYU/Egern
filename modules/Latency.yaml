name: "Latency"
description: "测试多个策略的 HTTP 综合延迟和抖动。"
author: "BABYANYU"
compat_arguments:
  NODES: ""
compat_arguments_desc: "NODES：待测节点名称，使用 § 分隔，须与本机节点名称一致。留空仅检测 Proxy 路径。名单需自行同步，不会自动枚举策略组。"
scriptings:
  - generic:
      name: "yanyu-latency"
      script_url: "https://raw.githubusercontent.com/BABYANYU/Egern/main/scripts/Latency.js?v=20261015-1"
      update_interval: 60
      timeout: 60
widgets:
  - name: "Latency"
    script_name: "yanyu-latency"
    env:
      NODES: "{{{NODES}}}"
